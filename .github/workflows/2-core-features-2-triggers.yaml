name: Triggering Events

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      # include markdown files
      - "03-core-features/filters/*.md"
      #exclude txt files
      - "!03-core-features/filters/*.txt"
  schedule:
    - cron: "0 0 * * *"
  # I am modifying the workflow_dispatch event to include an input parameter
  workflow_dispatch:

jobs:
  echo-event:
    runs-on: ubuntu-24.04
    steps:
      - name: Dump full event JSON
        run: |
          echo "=== $GITHUB_EVENT_NAME payload ==="
          echo "${{ toJson(github.event) }}"
